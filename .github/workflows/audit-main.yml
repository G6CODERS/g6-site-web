name: Audit main

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    if: vars.ALLOW_DIRECT_PUSH != 'true'
    steps:
      - name: Detect direct push
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.after;
            const { owner, repo } = context.repo;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sha,
            });
            if (prs.data.length === 0) {
              await github.rest.issues.create({
                owner, repo,
                title: `Direct push detected on main (${sha.slice(0, 7)})`,
                body: `Commit ${sha} was pushed directly to main by @${context.actor}.\n\nPlease revert it and open a pull request. See the internal handbook for the review rule.`,
              });
            }
